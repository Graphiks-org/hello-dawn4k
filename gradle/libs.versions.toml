# Version catalog — every external library the project consumes is declared here.
# WebGPU/dawn4k/Kalligraphie publish snapshots on the GraphiksSnapshots repository
# (see settings.gradle.kts); kffi-harfbuzz-wasm-js still lives under the legacy
# org.graphiks group on the same snapshot repository.

[versions]
webgpu = "0.1.0-SNAPSHOT"
dawn4k = "1.0.0-SNAPSHOT"
kalligraphie = "1.0.0-SNAPSHOT"
kffi = "1.0.0-SNAPSHOT"
kotlinxCoroutines = "1.11.0"
kotlinxBrowser = "0.3"

[libraries]
webgpu-api = { module = "org.graphiks.webgpu:api", version.ref = "webgpu" }
webgpu-descriptors = { module = "org.graphiks.webgpu:descriptors", version.ref = "webgpu" }
webgpu-browser = { module = "org.graphiks.webgpu:browser", version.ref = "webgpu" }
webgpu-toolkit-core = { module = "org.graphiks.webgpu:toolkit-core", version.ref = "webgpu" }
webgpu-toolkit-surface = { module = "org.graphiks.webgpu:toolkit-surface", version.ref = "webgpu" }
webgpu-toolkit-web = { module = "org.graphiks.webgpu:toolkit-web", version.ref = "webgpu" }
dawn4k-webgpu-toolkit = { module = "org.graphiks.webgpu:dawn4k-webgpu-toolkit", version.ref = "dawn4k" }
kalligraphie = { module = "org.graphiks.kalligraphie:kalligraphie", version.ref = "kalligraphie" }
kalligraphie-api = { module = "org.graphiks.kalligraphie:api", version.ref = "kalligraphie" }
kalligraphie-shaping = { module = "org.graphiks.kalligraphie:shaping", version.ref = "kalligraphie" }
kalligraphie-layout = { module = "org.graphiks.kalligraphie:layout", version.ref = "kalligraphie" }
kalligraphie-raster-cpu = { module = "org.graphiks.kalligraphie:raster-cpu", version.ref = "kalligraphie" }
kffi-harfbuzz-wasm-js = { module = "org.graphiks:kffi-harfbuzz-wasm-js", version.ref = "kffi" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinxBrowser" }
